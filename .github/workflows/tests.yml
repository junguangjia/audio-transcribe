name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Provision pinned media decoder
        run: |
          .venv/bin/python -m pip install --only-binary=:all: --no-deps --target native/vendor imageio-ffmpeg==0.6.0
      - name: Build local app
        run: .venv/bin/python scripts/build-app.py
      - name: Python fixtures
        run: .venv/bin/python -m pytest -q
      - name: Native logic checks
        run: sh scripts/test-native.sh
      - name: Native window layout checks
        run: bash scripts/test-layout.sh
      - name: Verify local signature
        run: codesign --verify --deep --strict native/build/AudioTranscribe.app
